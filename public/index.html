<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Склад — учёт товаров</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Экран входа -->
  <div id="login-screen" class="login-screen">
    <form id="login-form" class="login-box">
      <h1>Склад</h1>
      <p class="muted">Учёт товаров</p>
      <input id="login-username" type="text" placeholder="Логин" autocomplete="username" required>
      <input id="login-password" type="password" placeholder="Пароль" autocomplete="current-password" required>
      <button type="submit">Войти</button>
      <div id="login-error" class="error"></div>
    </form>
  </div>

  <!-- Основное приложение -->
  <div id="app" class="app hidden">
    <header class="topbar">
      <div class="brand">Склад</div>
      <div class="user-info">
        <span id="user-name"></span>
        <button id="logout-btn" class="link-btn">Выйти</button>
      </div>
    </header>

    <nav class="tabs">
      <button class="tab active" data-tab="dashboard">Обзор</button>
      <button class="tab" data-tab="products">Товары</button>
      <button class="tab" data-tab="movements">Движения</button>
      <button class="tab admin-only" data-tab="users">Пользователи</button>
    </nav>

    <main class="content">

      <!-- Обзор -->
      <section id="tab-dashboard" class="tab-content">
        <div class="cards">
          <div class="card"><div class="card-value" id="stat-products">0</div><div class="card-label">Позиций</div></div>
          <div class="card"><div class="card-value" id="stat-qty">0</div><div class="card-label">Единиц на складе</div></div>
          <div class="card"><div class="card-value" id="stat-value">0</div><div class="card-label">Стоимость остатка</div></div>
        </div>
        <h3>Заканчивается на складе</h3>
        <div id="low-stock" class="list"></div>
      </section>

      <!-- Товары -->
      <section id="tab-products" class="tab-content hidden">
        <div class="toolbar">
          <input id="product-search" type="search" placeholder="Поиск по названию или артикулу...">
          <button id="add-product-btn" class="primary">+ Товар</button>
        </div>
        <div id="products-list" class="list"></div>
      </section>

      <!-- Движения -->
      <section id="tab-movements" class="tab-content hidden">
        <h3>Последние операции</h3>
        <div id="movements-list" class="list"></div>
      </section>

      <!-- Пользователи -->
      <section id="tab-users" class="tab-content hidden">
        <div class="toolbar">
          <h3>Пользователи</h3>
          <button id="add-user-btn" class="primary">+ Пользователь</button>
        </div>
        <div id="users-list" class="list"></div>
        <button id="change-pass-btn" class="link-btn" style="margin-top:16px">Сменить свой пароль</button>
      </section>

    </main>
  </div>

  <!-- Модальное окно -->
  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="modal-title"></h3>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
